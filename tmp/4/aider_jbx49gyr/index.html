<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimalist Wordle</title>
    <link rel="stylesheet" href="styles.css">
    <script src="frontend.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Wordle</h1>
      <div id="game-board"></div>
      <form id="guess-form" autocomplete="off">
        <input id="guess-input" type="text" maxlength="5" minlength="5" pattern="[A-Za-z]{5}" autofocus autocomplete="off" />
        <button type="submit">Enter</button>
      </form>
      <div id="message"></div>
    </main>
  </body>
</html>

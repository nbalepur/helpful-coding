<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Tic Tac Toe</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="frontend.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Space Tic Tac Toe</h1>
      <div id="game">
        <div id="board" class="board">
          <!-- Cells will be generated by JS -->
          <svg id="win-line" width="240" height="240" style="position:absolute; left:0; top:0; pointer-events:none; z-index:2; display:none;"></svg>
        </div>
        <div id="status" class="status"></div>
        <button id="restart-btn" type="button">Restart</button>
      </div>
    </main>
  </body>
</html>

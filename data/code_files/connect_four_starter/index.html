<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four</title>
    <link rel="stylesheet" href="styles.css">
    <script src="frontend.js" defer></script>
  </head>
  <body>
    <main class="container">

      <h1 class="title">Connect Four</h1>

      <section class="panel" aria-label="Game">
        <div id="status" aria-live="polite"></div>
        <div class="columns" aria-label="Column controls">
          <button class="colbtn" type="button" data-col="0" aria-label="Column 1">▼</button>
          <button class="colbtn" type="button" data-col="1" aria-label="Column 2">▼</button>
          <button class="colbtn" type="button" data-col="2" aria-label="Column 3">▼</button>
          <button class="colbtn" type="button" data-col="3" aria-label="Column 4">▼</button>
          <button class="colbtn" type="button" data-col="4" aria-label="Column 5">▼</button>
          <button class="colbtn" type="button" data-col="5" aria-label="Column 6">▼</button>
          <button class="colbtn" type="button" data-col="6" aria-label="Column 7">▼</button>
        </div>
        <div id="board" class="board board--7" aria-label="Connect Four board">
          <button class="cell" type="button" data-index="0" aria-label="Row 1 Col 1"></button>
          <button class="cell" type="button" data-index="1" aria-label="Row 1 Col 2"></button>
          <button class="cell" type="button" data-index="2" aria-label="Row 1 Col 3"></button>
          <button class="cell" type="button" data-index="3" aria-label="Row 1 Col 4"></button>
          <button class="cell" type="button" data-index="4" aria-label="Row 1 Col 5"></button>
          <button class="cell" type="button" data-index="5" aria-label="Row 1 Col 6"></button>
          <button class="cell" type="button" data-index="6" aria-label="Row 1 Col 7"></button>
          <button class="cell" type="button" data-index="7" aria-label="Row 2 Col 1"></button>
          <button class="cell" type="button" data-index="8" aria-label="Row 2 Col 2"></button>
          <button class="cell" type="button" data-index="9" aria-label="Row 2 Col 3"></button>
          <button class="cell" type="button" data-index="10" aria-label="Row 2 Col 4"></button>
          <button class="cell" type="button" data-index="11" aria-label="Row 2 Col 5"></button>
          <button class="cell" type="button" data-index="12" aria-label="Row 2 Col 6"></button>
          <button class="cell" type="button" data-index="13" aria-label="Row 2 Col 7"></button>
          <button class="cell" type="button" data-index="14" aria-label="Row 3 Col 1"></button>
          <button class="cell" type="button" data-index="15" aria-label="Row 3 Col 2"></button>
          <button class="cell" type="button" data-index="16" aria-label="Row 3 Col 3"></button>
          <button class="cell" type="button" data-index="17" aria-label="Row 3 Col 4"></button>
          <button class="cell" type="button" data-index="18" aria-label="Row 3 Col 5"></button>
          <button class="cell" type="button" data-index="19" aria-label="Row 3 Col 6"></button>
          <button class="cell" type="button" data-index="20" aria-label="Row 3 Col 7"></button>
          <button class="cell" type="button" data-index="21" aria-label="Row 4 Col 1"></button>
          <button class="cell" type="button" data-index="22" aria-label="Row 4 Col 2"></button>
          <button class="cell" type="button" data-index="23" aria-label="Row 4 Col 3"></button>
          <button class="cell" type="button" data-index="24" aria-label="Row 4 Col 4"></button>
          <button class="cell" type="button" data-index="25" aria-label="Row 4 Col 5"></button>
          <button class="cell" type="button" data-index="26" aria-label="Row 4 Col 6"></button>
          <button class="cell" type="button" data-index="27" aria-label="Row 4 Col 7"></button>
          <button class="cell" type="button" data-index="28" aria-label="Row 5 Col 1"></button>
          <button class="cell" type="button" data-index="29" aria-label="Row 5 Col 2"></button>
          <button class="cell" type="button" data-index="30" aria-label="Row 5 Col 3"></button>
          <button class="cell" type="button" data-index="31" aria-label="Row 5 Col 4"></button>
          <button class="cell" type="button" data-index="32" aria-label="Row 5 Col 5"></button>
          <button class="cell" type="button" data-index="33" aria-label="Row 5 Col 6"></button>
          <button class="cell" type="button" data-index="34" aria-label="Row 5 Col 7"></button>
          <button class="cell" type="button" data-index="35" aria-label="Row 6 Col 1"></button>
          <button class="cell" type="button" data-index="36" aria-label="Row 6 Col 2"></button>
          <button class="cell" type="button" data-index="37" aria-label="Row 6 Col 3"></button>
          <button class="cell" type="button" data-index="38" aria-label="Row 6 Col 4"></button>
          <button class="cell" type="button" data-index="39" aria-label="Row 6 Col 5"></button>
          <button class="cell" type="button" data-index="40" aria-label="Row 6 Col 6"></button>
          <button class="cell" type="button" data-index="41" aria-label="Row 6 Col 7"></button>
        </div>
        <button id="reset" type="button">Reset</button>
      </section>

    </main>
  </body>
</html>
